<div class="flex min-h-screen flex-col bg-canvas text-ink">
  <!-- Skip to main content link for keyboard accessibility -->
  <a
    href="#main-content"
    class="sr-only focus:not-sr-only focus:fixed focus:left-3 focus:top-3 focus:z-[60] focus:rounded-lg focus:bg-brand-strong focus:px-4 focus:py-2 focus:text-sm focus:font-semibold focus:text-on-brand"
  >
    Skip to main content
  </a>

  <app-navbar [brandName]="data().hero.name" [navItems]="data().navItems" />

  <main id="main-content" class="flex-1">
    <app-hero [hero]="data().hero" />

    <section id="about" aria-labelledby="about-heading" class="section">
      <app-about [about]="data().about" />
    </section>

    <section id="skills" aria-labelledby="skills-heading" class="section border-t border-line bg-surface/40">
      <app-skills [skillGroups]="data().skillGroups" />
    </section>

    <section id="experience" aria-labelledby="experience-heading" class="section border-t border-line">
      <app-experience [experiences]="data().experiences" />
    </section>

    <section id="impact" aria-labelledby="impact-heading" class="section border-t border-line bg-surface/40">
      <app-impact [items]="data().impact" />
    </section>

    <section id="projects" aria-labelledby="projects-heading" class="section border-t border-line">
      <app-projects [projects]="data().projects" />
    </section>

    <section id="education" aria-labelledby="education-heading" class="section border-t border-line bg-surface/40">
      <app-education [education]="data().education" />
    </section>

    <section id="contact" aria-labelledby="contact-heading" class="section border-t border-line">
      <app-contact [contact]="data().contact" />
    </section>
  </main>

  <app-footer
    [name]="data().hero.name"
    [copyright]="data().footerCopyright"
    [navItems]="data().navItems"
    [socialLinks]="data().hero.socialLinks"
  />
</div>
